name: "auto-publish"

on:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"       # Apple Silicon (M1+)
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-22.04"       # Linux
            args: ""
          - platform: "windows-latest"     # Windows
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # -------------------
      # Node setup
      # -------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install pnpm
        run: |
          npm install -g pnpm
          echo "PATH=$(npm bin -g):$PATH" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      # -------------------
      # Rust setup & caching
      # -------------------
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-

      # -------------------
      # macOS specific setup
      # -------------------
      - name: Setup macOS build environment
        if: matrix.platform == 'macos-latest'
        run: |
          brew install lame
          echo "LAME_STATIC=0" >> $GITHUB_ENV
          echo "LAME_NO_BUILD=1" >> $GITHUB_ENV
          echo "LIBMP3LAME_SYS_NO_PKG_CONFIG=1" >> $GITHUB_ENV
          echo "LAME_INCLUDE_DIR=$(brew --prefix lame)/include" >> $GITHUB_ENV
          echo "LAME_LIB_DIR=$(brew --prefix lame)/lib" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix lame)/lib" >> $GITHUB_ENV
          echo "CPATH=$(brew --prefix lame)/include" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix lame)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          echo "$(brew --prefix lame)/lib/pkgconfig" >> $GITHUB_PATH

      - name: Verify LAME installation (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          brew list lame
          ls -la $(brew --prefix lame)/lib/libmp3lame*
          pkg-config --exists mp3lame && echo "LAME pkg-config found" || echo "LAME pkg-config NOT found"
          pkg-config --libs --cflags mp3lame || echo "pkg-config failed for LAME"

      # -------------------
      # Linux dependencies
      # -------------------
      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            pkg-config

      # -------------------
      # Frontend dependencies
      # -------------------
      - name: Install frontend dependencies (pnpm)
        run: pnpm install

      - name: Sync package version
        run: pnpm run version:sync

      # -------------------
      # Build & publish
      # -------------------
      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS LAME config
          LAME_STATIC: ${{ matrix.platform == 'macos-latest' && '0' || '' }}
          LAME_NO_BUILD: ${{ matrix.platform == 'macos-latest' && '1' || '' }}
          LIBMP3LAME_SYS_NO_PKG_CONFIG: ${{ matrix.platform == 'macos-latest' && '1' || '' }}
          LAME_INCLUDE_DIR: ${{ matrix.platform == 'macos-latest' && env.LAME_INCLUDE_DIR || '' }}
          LAME_LIB_DIR: ${{ matrix.platform == 'macos-latest' && env.LAME_LIB_DIR || '' }}
          LIBRARY_PATH: ${{ matrix.platform == 'macos-latest' && env.LIBRARY_PATH || '' }}
          CPATH: ${{ matrix.platform == 'macos-latest' && env.CPATH || '' }}
        with:
          tagName: __VERSION__
          releaseName: "Sound Stitch __VERSION__"
          releaseBody: |
            ## Sound Stitch __VERSION__
            Advanced offline sample manager and processing application.

            ### Downloads
            - **Windows:** Setup executable & MSI installer
            - **macOS:** Apple Silicon DMG
            - **Linux:** DEB package & AppImage

            See the assets below to download and install.
          releaseDraft: true
          prerelease: false
          tauriScript: "pnpm run tauri"
          args: ${{ matrix.args }}
