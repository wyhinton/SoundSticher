name: auto-publish

on:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            arch: arm64
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            arch: x86_64
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            arch: x86_64
            args: ""
          - platform: windows-latest
            arch: x86_64
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || (matrix.args == '--target x86_64-apple-darwin' && 'x86_64-apple-darwin' || '') }}

      - name: Install macOS dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          brew install nasm autoconf automake libtool pkg-config

      - name: Build LAME from source
        if: matrix.platform == 'macos-latest'
        run: |
          git clone https://github.com/rbrito/lame.git
          cd lame

          # Set prefix inside workspace to avoid /usr/local
          LAME_PREFIX="$HOME/lame-${{ matrix.arch }}"
          mkdir -p "$LAME_PREFIX"

          # Configure based on architecture
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            echo "Building LAME for x86_64..."
            ./configure \
              --build=x86_64-apple-darwin \
              --host=x86_64-apple-darwin \
              --disable-nasm \
              --disable-shared \
              --disable-mp3x \
              --prefix="$LAME_PREFIX"
          else
            echo "Building LAME for arm64..."
            ./configure \
              --build=arm-apple-darwin \
              --host=arm-apple-darwin \
              --disable-shared \
              --disable-asm \
              --disable-mp3x \
              --prefix="$LAME_PREFIX"
          fi

          make -j$(sysctl -n hw.ncpu)
          make install

          # export for later Rust build steps
          echo "LAME_INCLUDE_DIR=$LAME_PREFIX/include" >> $GITHUB_ENV
          echo "LAME_LIB_DIR=$LAME_PREFIX/lib" >> $GITHUB_ENV

      - name: Verify LAME installation
        if: matrix.platform == 'macos-latest'
        run: |
          echo "Verifying LAME installation..."
          ls -la $LAME_LIB_DIR
          file $LAME_LIB_DIR/libmp3lame.a || true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev pkg-config

      - name: Install frontend dependencies
        run: npm install

      - name: Sync package version
        run: npm run version:sync

      - name: Build & Publish with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAME_INCLUDE_DIR: ${{ env.LAME_INCLUDE_DIR }}
          LAME_LIB_DIR: ${{ env.LAME_LIB_DIR }}
          LAME_STATIC: "1"
        with:
          tagName: __VERSION__
          releaseName: "Sound Stitch __VERSION__"
          releaseBody: |
            ## Sound Stitch __VERSION__

            Advanced offline sample manager and processing application.

            ### Downloads
            - **Windows**: Setup EXE and MSI installer
            - **macOS**: Universal DMG (Intel + Apple Silicon)
            - **Linux**: DEB package and AppImage

            See the assets below to download and install.
          releaseDraft: true
          prerelease: false
          tauriScript: "npm run tauri"
          args: ${{ matrix.args }}
