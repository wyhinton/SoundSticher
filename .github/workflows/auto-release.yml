name: "auto-publish"

on:
  push:
    branches:
      - release

# This workflow will trigger on each push to the `release` branch to create or update a GitHub release, build app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup macOS build environment
        if: matrix.platform == 'macos-latest'
        run: |
          brew install lame
          # Also build an x86_64 version of LAME for Intel target
          mkdir -p /tmp/lame-x86_64
          cd /tmp/lame-x86_64
          arch -x86_64 curl -LO https://downloads.sourceforge.net/project/lame/lame/3.100/lame-3.100.tar.gz
          tar xf lame-3.100.tar.gz
          cd lame-3.100
          arch -x86_64 ./configure --prefix=/usr/local/x86_64-lame --disable-shared
          arch -x86_64 make -j$(sysctl -n hw.ncpu)
          arch -x86_64 make install
          echo "LAME_INCLUDE_DIR=/usr/local/x86_64-lame/include" >> $GITHUB_ENV
          echo "LAME_LIB_DIR=/usr/local/x86_64-lame/lib" >> $GITHUB_ENV

      - name: Verify LAME installation (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          # Verify LAME is properly installed and accessible
          brew list lame
          ls -la $(brew --prefix lame)/lib/libmp3lame*
          pkg-config --exists mp3lame && echo "LAME pkg-config found" || echo "LAME pkg-config NOT found"
          pkg-config --libs --cflags mp3lame || echo "pkg-config failed for LAME"

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev pkg-config
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
        # You can remove the one that doesn't apply to your app to speed up the workflow a bit.
        # libasound2-dev: ALSA development libraries for audio functionality
        # pkg-config: Required for finding system libraries

      - name: install frontend dependencies
        run: npm install # change this to npm, pnpm or bun depending on which one you use.

      - name: Sync package version
        run: npm run version:sync

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ensure LAME environment variables are available during build
          LAME_STATIC: ${{ matrix.platform == 'macos-latest' && '0' || '' }}
          LAME_HOST: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin' || '' }}
          LAME_INCLUDE_DIR: ${{ matrix.platform == 'macos-latest' && env.LAME_INCLUDE_DIR || '' }}
          LAME_LIB_DIR: ${{ matrix.platform == 'macos-latest' && env.LAME_LIB_DIR || '' }}
        with:
          tagName: __VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "Sound Stitch __VERSION__"
          releaseBody: "## Sound Stitch __VERSION__\n\n Advanced offline sample manager and processing application\n\n### Downloads\n- **Windows**: Setup executable and MSI installer\n- **macOS**: Universal DMG for Intel and Apple Silicon\n- **Linux**: DEB package and AppImage\n\nSee the assets below to download and install."
          releaseDraft: true
          prerelease: false
          tauriScript: "npm run tauri"
          args: ${{ matrix.args }}

