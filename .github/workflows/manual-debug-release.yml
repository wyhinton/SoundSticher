name: "manual-publish-debug"

on:
  workflow_dispatch:

# This workflow should be triggered manually for the `release` branch to create or update a GitHub release, build app, and upload the artifacts to the release.

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # for Tauri v1 you could replace this with ubuntu-20.04.
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup macOS build environment
        if: matrix.platform == 'macos-latest'
        run: |
          # Install LAME for MP3 encoding support
          brew install lame
          # Force the use of system LAME library and disable problematic optimizations
          echo "LAME_STATIC=0" >> $GITHUB_ENV
          echo "LAME_NO_NASM=1" >> $GITHUB_ENV
          echo "LAME_NO_SSE=1" >> $GITHUB_ENV
          echo "LAME_INCLUDE_DIR=$(brew --prefix lame)/include" >> $GITHUB_ENV  
          echo "LAME_LIB_DIR=$(brew --prefix lame)/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix lame)/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
          # Additional build flags for macOS
          echo "CFLAGS=-I$(brew --prefix lame)/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix lame)/lib" >> $GITHUB_ENV
          # Ensure pkg-config can find LAME
          echo "$(brew --prefix lame)/lib/pkgconfig" >> $GITHUB_PATH

      - name: Verify LAME installation (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          # Verify LAME is properly installed and accessible
          brew list lame
          ls -la $(brew --prefix lame)/lib/libmp3lame*
          pkg-config --exists mp3lame && echo "LAME pkg-config found" || echo "LAME pkg-config NOT found"
          pkg-config --libs --cflags mp3lame || echo "pkg-config failed for LAME"

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev pkg-config
        # webkitgtk 4.0 is for Tauri v1 - webkitgtk 4.1 is for Tauri v2.
        # You can remove the one that doesn't apply to your app to speed up the workflow a bit.
        # libasound2-dev: ALSA development libraries for audio functionality
        # pkg-config: Required for finding system libraries during build

      - name: install frontend dependencies
        run: npm install # change this to npm, pnpm or bun depending on which one you use.

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ensure LAME environment variables are available during build
          LAME_STATIC: ${{ matrix.platform == 'macos-latest' && '0' || '' }}
          LAME_NO_NASM: ${{ matrix.platform == 'macos-latest' && '1' || '' }}
          LAME_NO_SSE: ${{ matrix.platform == 'macos-latest' && '1' || '' }}
          LAME_INCLUDE_DIR: ${{ matrix.platform == 'macos-latest' && env.LAME_INCLUDE_DIR || '' }}
          LAME_LIB_DIR: ${{ matrix.platform == 'macos-latest' && env.LAME_LIB_DIR || '' }}
        with:
          tagName: __VERSION__ # the action automatically replaces __VERSION__ with the app version.
          releaseName: "Sound Stitch DEBUG __VERSION__"
          releaseBody: "## Sound Stitch DEBUG __VERSION__\n\n🎵 Audio mixing and processing application\n\n**⚠️ DEBUG BUILD** - For testing and development purposes\n\n### Downloads\n- **Windows**: Setup executable and MSI installer\n- **macOS**: Universal DMG for Intel and Apple Silicon\n- **Linux**: DEB package and AppImage\n\nSee the assets below to download and install."
          releaseDraft: true
          prerelease: false
          includeDebug: true
          args: ${{ matrix.args }}
